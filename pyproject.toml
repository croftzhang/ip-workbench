[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ip-workbench"
version = "0.1.0"
description = "Investment-portfolio analytics workbench for agency MBS: a deterministic engine with a classic CLI (v1) and a local-LLM agent (v2)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
# Release 2, the assistant:  pip install -e ".[agent]"
# Exact versions, because these libraries change their public interfaces between releases
# (docs/AGENT_DESIGN.md, section 7). Each build step adds the packages it uses.
agent = [
    "pydantic==2.14.3",  # argument schemas of the tools
    "mcp==2.3.0",        # the optional MCP server; version 2 of the SDK
]

[project.scripts]
ipw = "ipw.classic.cli:main"
ipw-mcp = "ipw.agent:mcp_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # typer.Option(...) in argument defaults is the Typer idiom
    "B905",  # zip() over columns of one table; strict= adds nothing
]
