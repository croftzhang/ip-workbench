[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ip-workbench"
version = "0.1.0"
description = "Investment-portfolio analytics workbench for agency MBS: a deterministic engine with a classic CLI (v1) and a local-LLM agent (v2)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
# Release 2, the assistant:  pip install -e ".[agent]"
# Exact versions, because these libraries change their public interfaces between releases
# (docs/AGENT_DESIGN.md, section 7). Each build step adds the packages it uses.
agent = [
    "pydantic==2.14.3",                 # argument schemas of the tools
    "mcp==2.3.0",                       # the optional MCP server; version 2 of the SDK
    "langchain-core==1.7.7",            # documents, embeddings and vector store interfaces
    "langchain-text-splitters==1.1.3",  # splitting the knowledge base by Markdown heading
    "langchain-ollama==1.1.0",          # the local embedding model
    "langchain-chroma==1.1.0",          # the vector index
    "chromadb==1.5.9",
    "rank-bm25==0.2.2",                 # the optional keyword index
    "langgraph==1.2.20",                # the four-node loop
]
# The optional reranker; brings PyTorch:  pip install -e ".[agent,rerank]"
rerank = ["sentence-transformers==6.2.0"]

[project.scripts]
ipw = "ipw.classic.cli:main"
ipw-ai = "ipw.agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # raised inside a dependency of langchain-core on recent Python versions; nothing here calls it
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # typer.Option(...) in argument defaults is the Typer idiom
    "B905",  # zip() over columns of one table; strict= adds nothing
]
